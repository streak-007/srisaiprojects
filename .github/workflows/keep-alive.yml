name: Keep Supabase awake

on:
  schedule:
    # Every 3 days
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Set repository variable SITE_URL to your deployed app origin (e.g. https://srisaiprojects.vercel.app)"
            exit 0
          fi
          curl -fsS "$SITE_URL/api/health"
          echo
